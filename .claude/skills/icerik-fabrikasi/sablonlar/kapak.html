<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>{{DOSYA}}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=IBM+Plex+Mono:wght@400&family=IBM+Plex+Sans:wght@400;500&display=block" rel="stylesheet">
<style>
  /*
    İçerik fabrikası · KAPAK (Reels kapağı) şablonu · 1080×1920 (9:16)
    DESIGN.md §8: profil ızgarası üstten ve alttan 240'ar px kırpar; başlık ortadaki 1080×1440 alanda (y = 240…1680), yanlarda 60 px.
    Kapakta CTA basılmaz; CTA Reels açıklamasına gider.
  */
  :root {
    --kagit: #FAF7F2; --yulaf: #EDE3D6; --murekkep: #1F1B17; --muhur: #2F4A3A; --kursun: #6B645B;
    --kenar: 60px; --izgara: 240px;
  }
  * { margin: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; background: var(--kagit); }
  .tuval { position: relative; width: 1080px; height: 1920px; overflow: hidden; color: var(--murekkep); }
  [data-yazi]:empty { display: none; }

  .foto { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: {{ODAK}}; }

  .ust { position: absolute; top: calc(var(--izgara) + 70px); left: var(--kenar); right: var(--kenar); }
  .etiket { display: inline-block; background: var(--yulaf); font: 400 30px/1 "IBM Plex Mono", monospace; padding: 14px 20px; }
  h1 {
    margin-top: 34px;
    font-family: "Fraunces", serif; font-optical-sizing: auto; font-weight: 400;
    font-size: 140px; line-height: .98; letter-spacing: -0.02em;
  }
  .metin { margin-top: 34px; max-width: 900px; padding-top: 22px; border-top: 1.5px solid var(--kursun); font: 400 40px/1.3 "IBM Plex Sans", sans-serif; }
  .terim { display: inline-block; margin-top: 26px; padding: 12px 16px 14px; background: var(--yulaf); }
  .terim:has(.ad:empty) { display: none; }
  .terim .ad { font: 400 28px/1.25 "IBM Plex Mono", monospace; }
  .terim .tr { font: 400 34px/1.25 "IBM Plex Sans", sans-serif; }

  /* ---------- AIDA ağırlıkları (kapak takvimde "istek" aşamasında) ---------- */
  .asama-dikkat h1 { font-size: 140px; }
  .asama-istek h1 { font-size: 132px; }
  .asama-eylem h1 { font-size: 120px; }

  /* ---------- Kontrol kopyası: #kontrol ---------- */
  .kontrol { display: none; position: absolute; inset: 0; pointer-events: none; }
  #kontrol:target { display: block; }
  .kontrol .bant { position: absolute; left: 0; right: 0; height: var(--izgara); background: rgba(255, 0, 0, .35); }
  .kontrol .bant.u { top: 0; } .kontrol .bant.a { bottom: 0; }
  .kontrol .yan { position: absolute; top: var(--izgara); bottom: var(--izgara); width: var(--kenar); background: rgba(255, 0, 0, .15); }
  .kontrol .yan.s { left: 0; } .kontrol .yan.g { right: 0; }
</style>
</head>
<body>
<div class="tuval {{SINIF}} asama-{{ASAMA}}">
  <img class="foto" src="{{GORSEL}}" alt="">

  <div class="ust">
    <p class="etiket" data-yazi>{{ETIKET}}</p>
    <h1 data-yazi>{{BASLIK}}</h1>
    <p class="metin" data-yazi>{{METIN}}</p>
    <div class="terim"><p class="ad" data-yazi>{{TERIM_AD}}</p><p class="tr" data-yazi>{{TERIM_TR}}</p></div>
  </div>

  <div class="kontrol" id="kontrol">
    <div class="bant u"></div><div class="bant a"></div><div class="yan s"></div><div class="yan g"></div>
  </div>
</div>
</body>
</html>
