<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sosyal Temas Sayfası</title>
<style>
  :root {
    --bg: #FAF7F2; --surface: #FFFFFF; --ink: #1F1B17; --muted: #6B645B; --line: #E2DAD0;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --bg: #171512; --surface: #201D19; --ink: #EDE3D6; --muted: #A39A8E; --line: #36312B; }
  }
  :root[data-theme="dark"] { --bg: #171512; --surface: #201D19; --ink: #EDE3D6; --muted: #A39A8E; --line: #36312B; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  header, main { max-width: 1600px; margin: 0 auto; padding: 0 16px; }
  header { padding-top: 32px; }
  h1 { font-size: 22px; font-weight: 600; margin: 0 0 4px; }
  header p, .alt { margin: 0; color: var(--muted); }
  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 32px 0 12px; font-weight: 600; }
  .sira { display: flex; gap: 16px; align-items: flex-end; overflow-x: auto; padding-bottom: 8px; }
  figure { margin: 0; flex: 0 0 auto; }
  figure a { display: block; }
  figure img { display: block; height: 520px; width: auto; border: 1px solid var(--line); border-radius: 6px; background: var(--line); }
  figcaption { margin-top: 8px; font-size: 13px; }
  figcaption b { display: block; font-weight: 600; }
  .mono { font: 12px/1.4 ui-monospace, "SF Mono", Menlo, monospace; color: var(--muted); }
  main { padding-bottom: 48px; }
  @media (max-width: 700px) { figure img { height: 380px; } }
</style>
</head>

<header>
