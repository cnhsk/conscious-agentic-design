<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>2026-10-18 kapak</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=IBM+Plex+Mono:wght@400&family=IBM+Plex+Sans:wght@400;500&display=block" rel="stylesheet">
<style>
  /* Yön A · Etiket — gorsel-yon.md. Reels kapağı: başlık ızgarada görünen y = 240…1680 alanında. */
  :root {
    --kagit: #FAF7F2;
    --yulaf: #EDE3D6;
    --murekkep: #1F1B17;
    --kursun: #6B645B;
    --kenar: 60px;
    --izgara-ust: 240px;
  }
  * { margin: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; background: var(--kagit); }
  .tuval { position: relative; width: 1080px; height: 1920px; color: var(--murekkep); }
  .tuval > img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }

  .yazi { position: absolute; top: calc(var(--izgara-ust) + 70px); left: var(--kenar); right: var(--kenar); }
  .etiket {
    display: inline-block;
    background: var(--yulaf);
    font: 400 30px/1 "IBM Plex Mono", monospace;
    padding: 14px 20px;
  }
  h1 {
    margin-top: 34px;
    font-family: "Fraunces", serif; font-optical-sizing: auto; font-weight: 400;
    font-size: 140px; line-height: .96; letter-spacing: -0.02em;
  }
  .metin {
    margin-top: 34px; max-width: 900px;
    font: 400 40px/1.3 "IBM Plex Sans", sans-serif;
    padding-top: 22px; border-top: 1.5px solid var(--kursun);
  }
</style>
</head>
<body>
<div class="tuval">
  <img src="2026-10-18-kapak-gorsel.png" alt="">
  <div class="yazi">
    <!-- marka-brief.md Ekip: "Nil Aydemir · kurucu" -->
    <p class="etiket">Nil Aydemir · kurucu</p>
    <h1>Neden<br>üç ürün?</h1>
    <!-- takvim.csv 2026-10-18 ana_mesaj, birebir -->
    <p class="metin">Kurucu, banyosundaki on bir ürünü neden üçe indirdiğini anlatıyor.</p>
  </div>
</div>
</body>
</html>
